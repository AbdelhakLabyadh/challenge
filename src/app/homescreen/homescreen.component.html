<div class="h-full justify-center pt-30 max-h-full">
    <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 p-8 gap-15">
        <app-card class="transition-transform transform hover:scale-105 cursor-pointer duration-300 ease-in-out" 
        *ngFor="let animal of cards()" [item]="animal" [routerLink]="['/one-pet', animal.id]" routerLinkActive="active" ariaCurrentWhenActive="page">
        </app-card>
    </div>
    <div class="flex justify-center items-center sticky z-9999 bottom-5 w-screen">
        <button (click)="reloadData()" type="button" 
        class=" w-50 text-white bg-[#00CCCC] hover:bg-cyan-600 
        font-medium rounded-xl text-sm px-5 py-2.5">
            Update
        </button>
    </div>
    </div>
